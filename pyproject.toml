[project]
name = "GANICE"
version = "0.1.0"
description = ""
authors = [
    {name = "Shu Tamano"}
]
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "numpy (>=2.4.4,<3.0.0)",
    "scipy (>=1.17.1,<2.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "torch (>=2.11.0,<3.0.0)",
    "lightgbm (>=4.7.0,<5.0.0)",
    "optuna (>=4.9.0,<5.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)"
]


[tool.poetry]
packages = [{include = "estimators"}]


[tool.poetry.group.dev.dependencies]
flake8 = ">=7.3,<8"
mypy = ">=1.15,<2"
ruff = ">=0.15,<0.16"
scipy-stubs = ">=1.17,<1.18"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.mypy]
python_version = "3.13"
files = ["estimators", "scripts"]
check_untyped_defs = true
warn_unused_ignores = true
